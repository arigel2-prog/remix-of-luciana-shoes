# Netlify config for the Luciana Shoes back-office.
# Served at lucianashoes.com/trade via a proxy rewrite on the public site.
# The public lucianashoes.com site is a separate Netlify site from a separate repo.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Asset prefix. Must match the path the public site proxies from.
  APP_BASE_PATH = "/trade/"

# SPA fallback. public/_redirects covers this too; keeping it here means the
# rules survive even if the public/ file is ever dropped from the build.
# Functions are mounted at /api/* (see the `config.path` export in each one).
[[redirects]]
  from = "/trade/api/*"
  to = "/api/:splat"
  status = 200

[[redirects]]
  from = "/trade/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/trade/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
